plugins {
    id 'io.freefair.lombok' version '9.2.0'
    id 'com.gradleup.shadow' version '9.4.1'
//    id 'org.cadixdev.licenser' version '0.6.1'
}

version = '1.0-SNAPSHOT'

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.freefair.lombok'
    apply plugin: 'com.gradleup.shadow'
    // apply plugin: 'org.cadixdev.licenser'

    tasks.configureEach {
        if (name == 'generateLombokConfig') {
            enabled = false
        }
    }

    repositories {
        mavenCentral()
        maven {
            url 'https://nexus.scarsz.me/content/groups/public/'
        }
    }

    configurations {
        shaded
        implementation.extendsFrom(shaded)
    }

    dependencies {
        if (project.name != 'common') {
            shaded project(':common')
        }
        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
        testImplementation 'org.mockito:mockito-core:5.14.2'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
    }

    jar {
        // avoid needing to run licenseFormat & shadowJar when building
        // dependsOn licenseFormat
        finalizedBy shadowJar
    }

    shadowJar {
        configurations = [project.configurations.shaded]
        // Relocate all shaded libraries to avoid split package issues in modern mod launchers (ModLauncher / NeoForge / Forge)
        relocate 'github.scarsz.configuralize', 'me.minecraftauth.config'
        relocate 'com.udojava.evalex', 'me.minecraftauth.lib.evalex'
        relocate 'com.github.benmanes.caffeine', 'me.minecraftauth.lib.caffeine'
        relocate 'org.yaml.snakeyaml', 'me.minecraftauth.lib.yaml'
        relocate 'org.json.simple', 'me.minecraftauth.lib.json'
        relocate 'com.github.kevinsawicki.http', 'me.minecraftauth.lib.http'
        relocate 'com.github.alexheretic', 'me.minecraftauth.lib.alexheretic'
        relocate 'org.checkerframework', 'me.minecraftauth.lib.checker'
        relocate 'com.google.errorprone', 'me.minecraftauth.lib.errorprone'

        archiveClassifier.set('')
        // Shadow 9.x no longer inherits archiveBaseName from the jar task.
        // Wire it lazily so subproject overrides (archiveBaseName = '...') still take precedence.
        archiveBaseName.convention(jar.archiveBaseName)
    }

    task sourcesJar(type: Jar, dependsOn: classes) {
        from sourceSets.main.allSource

        archiveClassifier.set('sources')
    }

    task javadocJar(type: Jar, dependsOn: javadoc) {
        from javadoc.destinationDir

        archiveClassifier.set('javadoc')
    }

//    artifacts {
//        archives sourcesJar
//        archives javadocJar
//    }


}
