name: CI Build

on:
  pull_request:
    branches: [devel]
    paths:
      - '**/*.java'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - 'settings.gradle'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build & Test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build all modules
        run: ./gradlew build --no-daemon

      - name: Run E2E tests
        run: ./gradlew :test-server-runner:test --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            server/bukkit/build/libs/MinecraftAuth-Bukkit-*.jar
            server/forge/*/build/libs/MinecraftAuth-Forge-*.jar
            server/fabric/*/build/libs/MinecraftAuth-Fabric-*.jar
            server/neoforge/*/build/libs/MinecraftAuth-NeoForge-*.jar
            proxy/velocity/build/libs/MinecraftAuth-Velocity-*.jar
          if-no-files-found: error
