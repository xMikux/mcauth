pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
    }
}

rootProject.name = 'MinecraftAuthentication-Plugin'

include 'common'
include 'server:bukkit'
include 'server:forge:1.18.2', 'server:forge:1.20.1', 'server:forge:1.21.1'
include 'server:fabric:1.21.1', 'server:fabric:1.21.11'
include 'server:neoforge:1.21.1'
include 'proxy:velocity'
include 'test-server-runner'
